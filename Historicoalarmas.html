<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Alarmas - Compacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/historicoalarmas.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h6 class="mb-0">Filtro de Alarmas (Columna F)</h6>
        </div>
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-md-5">
                    <input type="file" id="archivoExcel" class="form-control form-control-sm">
                </div>
                <div class="col-md-4">
                    <input type="date" id="fechaFiltro" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <button onclick="procesar()" class="btn btn-sm btn-success w-100">Filtrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="zonaResultados" class="mt-3">
        <div class="card shadow-sm">
            <div class="card-body p-2">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-bordered mb-0" id="tabla">
                        <thead class="table-dark" id="cabeceraTabla"></thead>
                        <tbody id="cuerpoTabla"></tbody>
                    </table>
                </div>
                <div class="mt-2 text-end">
                    <small class="fw-bold">Registros: <span id="contador">0</span></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/historicoalarmas.js"></script>
</body>
</html>
